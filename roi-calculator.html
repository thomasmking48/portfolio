  <label for="roiInput">Enter ROI Value:</label>
  <input type="number" id="roiInput" placeholder="e.g. 12500" />
  <button onclick="exportPDF()">Export to PDF</button>

  <script>
    async function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      const value = document.getElementById('roiInput').value;

      if (!value) {
        alert("Please enter a value.");
        return;
      }

      doc.setFontSize(18);
      doc.text("ROI Calculation Export", 20, 30);
      
      doc.setFontSize(14);
      doc.text(`Entered ROI Value: ${value}`, 20, 50);

      doc.save("ROI_Report.pdf");
    }
  </script>
